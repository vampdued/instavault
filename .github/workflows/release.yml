name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.2.0 or v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Run Test Suite
        working-directory: server
        run: go test -v -race ./...

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME}"
          fi
          CLEAN_VER="${RAW_VER#v}"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLEAN_VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist

      - name: Build Windows Binary (amd64)
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w -H=windowsgui -X main.Version=${{ steps.ver.outputs.version }}" -o ../dist/instavault-server.exe .
          cd ../dist
          zip -j instavault-windows-amd64.zip instavault-server.exe
          rm instavault-server.exe

      - name: Package Chrome Extension (Unified Version Sync)
        run: |
          python3 -c "
          import json
          with open('extension/manifest.json', 'r') as f:
              d = json.load(f)
          d['version'] = '${{ steps.ver.outputs.version }}'
          with open('extension/manifest.json', 'w') as f:
              json.dump(d, f, indent=2)
          "
          cd extension
          zip -r ../dist/instavault-extension.zip . -x ".*" -x "__MACOSX"
          cd ..

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

