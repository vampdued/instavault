name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.2.0 or v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Validate Extension & Run Tests
        run: |
          for f in extension/js/*.js; do node --check "$f"; done
          python3 -m json.tool extension/manifest.json > /dev/null
          python3 -m json.tool extension/_locales/en/messages.json > /dev/null
          (cd server && go test -v -race ./...)

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME}"
          fi
          CLEAN_VER="${RAW_VER#v}"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLEAN_VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist

      - name: Build Windows Binary (amd64)
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w -H=windowsgui -X main.Version=${{ steps.ver.outputs.version }}" -o ../dist/instavault-server.exe .
          cd ../dist
          zip -j instavault-windows-amd64.zip instavault-server.exe
          rm instavault-server.exe

      - name: Build Linux Binary (amd64)
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w -X main.Version=${{ steps.ver.outputs.version }}" -o ../dist/instavault-server .
          tar -czf ../dist/instavault-linux-amd64.tar.gz -C ../dist instavault-server
          rm ../dist/instavault-server

      - name: Build macOS Binary (arm64)
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -ldflags "-s -w -X main.Version=${{ steps.ver.outputs.version }}" -o ../dist/instavault-server .
          tar -czf ../dist/instavault-darwin-arm64.tar.gz -C ../dist instavault-server
          rm ../dist/instavault-server

      - name: Package Chrome Extension (Unified Version Sync)
        run: |
          mkdir -p dist/temp-ext
          cp -R extension/. dist/temp-ext/
          python3 -c "
          import json
          with open('dist/temp-ext/manifest.json', 'r') as f:
              d = json.load(f)
          d['version'] = '${{ steps.ver.outputs.version }}'
          with open('dist/temp-ext/manifest.json', 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          "
          (cd dist/temp-ext && zip -r ../instavault-extension.zip . -x ".*" -x "__MACOSX")
          rm -rf dist/temp-ext

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum *.zip *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
